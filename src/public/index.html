<!doctype html>
<html>
  <head>
    <title>Video Call</title>

    <!-- Socket.io client (use backend version ideally) -->
    <!-- <script src="https://nonethnically-modish-rickie.ngrok-free.dev/socket.io/socket.io.js"></script> -->
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <style>
      video {
        width: 300px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Video Calling</h2>

    <video id="localVideo" autoplay muted playsinline></video>
    <div id="remoteVideos"></div>
    <br />

    <button id="joinBtn" onclick="joinRoom()">Join Room</button>
    <button id="videoBtn" onclick="startCall('video')">Video Call</button>
    <button id="audioBtn" onclick="startCall('audio')">Audio Call</button>
    <button id="acceptBtn" onclick="acceptCall()">Accept</button>
    <button id="rejectBtn" onclick="rejectCall()">Reject</button>
    <button id="endBtn" onclick="endCall()">End</button>
    <button id="screenBtn" onclick="startScreenShare()">Share Screen</button>

    <script>
      const userId = prompt("Enter your userId");
      const receiverId = prompt("Enter receiverId (receiverId/groupId)");
      const chatType = prompt("Enter chatType (personal / group)");

      const socket = io("http://localhost:5000", {
        query: { userId },
      });
      const joinBtn = document.getElementById("joinBtn");
      const videoBtn = document.getElementById("videoBtn");
      const audioBtn = document.getElementById("audioBtn");
      const acceptBtn = document.getElementById("acceptBtn");
      const rejectBtn = document.getElementById("rejectBtn");
      const endBtn = document.getElementById("endBtn");
      const screenBtn = document.getElementById("screenBtn");

      acceptBtn.style.display = "none";
      rejectBtn.style.display = "none";
      endBtn.style.display = "none";
      screenBtn.style.display = "none";

      let roomId = chatType == "group" ? receiverId : null;
      let callId = null;
      let peerConnections = {};
      let localStream;
      let callType = null;
      let screenStream;
      let screenTrack;
      let isJoinRoom = false;
      // ========================
      // JOIN ROOM
      // ========================
      function joinRoom() {
        socket.emit("roomJoin", {
          roomId,
          receiverId,
          chatType,
        });
        console.log("inside room join");
      }

      socket.on("roomJoin", (data) => {
        if (data.success) {
          isJoinRoom = true;
          roomId = data.roomId;
          alert(roomId);
        } else {
          alert("failed to join room");
        }
      });

      // ========================
      // INIT WEBRTC
      // ========================
      async function initLocalStream() {
        if (localStream) return;
        localStream = await navigator.mediaDevices.getUserMedia({
          video: callType == "video",
          audio: true,
        });
        document.getElementById("localVideo").srcObject = localStream;
      }
      // PEER CONNECTION

      async function createPeerConnection(remoteUserId) {
        if (peerConnections[remoteUserId]) {
          return peerConnections[remoteUserId];
        }
        if (!localStream) await initLocalStream();
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });

        // Add local tracks
        localStream
          .getTracks()
          .forEach((track) => pc.addTrack(track, localStream));

        // On remote track
        pc.ontrack = (event) => {
          let remoteVideo = document.getElementById(
            "remoteVideo_" + remoteUserId,
          );
          if (!remoteVideo) {
            remoteVideo = document.createElement("video");
            remoteVideo.id = "remoteVideo_" + remoteUserId;
            remoteVideo.autoplay = true;
            remoteVideo.playsInline = true;
            remoteVideo.style.width = "300px";
            remoteVideo.style.border = "1px solid black";
            remoteVideo.style.margin = "10px";
            document.getElementById("remoteVideos").appendChild(remoteVideo);
          }
          remoteVideo.srcObject = event.streams[0];
        };

        // ICE candidate
        pc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("ice-candidate", {
              roomId,
              targetUserId: remoteUserId,
              candidate: event.candidate,
            });
          }
        };
        peerConnections[remoteUserId] = pc;
        return pc;
      }

      //=========================
      // START SCREEN SHARING
      //=========================
      async function startScreenShare() {
        try {
          if (!localStream) return;
          screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false,
          });
          screenTrack = screenStream.getVideoTracks()[0];
          document.getElementById("localVideo").srcObject = screenStream;
          Object.values(peerConnections).forEach(async (pc) => {
            const sender = pc
              .getSenders()
              .find((s) => s.track && s.track.kind === "video");
            if (sender) {
              await sender.replaceTrack(screenTrack);
            } else {
              pc.addTrack(screenTrack, screenStream);
            }
          });

          for (const pc of Object.values(peerConnections)) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            // emit to the corresponding remote user
            const remoteUserId = Object.keys(peerConnections).find(
              (id) => peerConnections[id] === pc,
            );
            socket.emit("offer", { roomId, offer, targetUserId: remoteUserId });
          }

          screenTrack.onended = async () => {
            if (!screenTrack) return;

            // Video call → go back to camera
            Object.values(peerConnections).forEach(async (pc) => {
              const sender = pc
                .getSenders()
                .find((s) => s.track.kind === "video");
              const videoTrack = localStream.getVideoTracks()[0];
              if (sender) {
                if (callType === "audio") {
                  await sender.replaceTrack(null);
                  document.getElementById("localVideo").srcObject = null;
                } else {
                  await sender.replaceTrack(videoTrack);
                  document.getElementById("localVideo").srcObject = localStream;
                }
              }
            });

            socket.emit("screen-share-stopped", { roomId });
            screenTrack.stop();
            screenTrack = null;
          };
        } catch (error) {
          console.log("Screen share error:", error);
        }
      }
      socket.on("screen-share-stopped", () => {
        Object.keys(peerConnections).forEach((remoteUserId) => {
          const remoteVideo = document.getElementById(
            "remoteVideo_" + remoteUserId,
          );
          if (remoteVideo) {
            remoteVideo.srcObject =
              peerConnections[remoteUserId].getRemoteStreams()[0] || null;
          }
        });
      });
      // ========================
      // START CALL
      // ========================
      async function startCall(type) {
        if (!isJoinRoom) {
          alert("Join room first");
          return;
        }
        callType = type;
        await initLocalStream();
        socket.emit("callUser", {
          roomId,
          receiverId,
          callType,
        });

        console.log("inside start call");
      }
      // socket.on("sendCallId", (data) => {
      //   callId = data.callId;
      // });
      socket.on("callUser", (data) => {
        callId = data.callId;
        callType = data.callType;
        alert("Incoming call from " + data.callerName);
        acceptBtn.style.display = "inline";
        rejectBtn.style.display = "inline";
      });

      // ========================
      // ACCEPT CALL
      // ========================
      async function acceptCall() {
        await initLocalStream();

        socket.emit("callAccept", {
          roomId,
          callId,
        });
        acceptBtn.style.display = "none";
        rejectBtn.style.display = "none";
        console.log("inside accept");
      }

      socket.on("callAccept", async (data) => {
        if (userId === data.callerId || userId === data.userId) {
          endBtn.style.display = "inline";
          screenBtn.style.display = "inline";
        }
        callId = data.callId;
        if (userId == data.callerId) {
          const pc = await createPeerConnection(receiverId);
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          socket.emit("offer", {
            roomId,
            offer,
          });
        }
      });
      socket.on("newParticipant", async (data) => {
        const { userId: remoteUserId } = data;
        if (remoteUserId === userId) return;

        if (!peerConnections[remoteUserId]) {
          const pc = await createPeerConnection(remoteUserId);

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          socket.emit("offer", {
            roomId,
            offer,
            targetUserId: remoteUserId,
          });
        }
      });
      // ========================
      // REJECT CALL
      // ========================
      function rejectCall() {
        socket.emit("callReject", {
          roomId,
          callId,
          userId,
        });
      }

      socket.on("callReject", () => {
        cleanupCall();
        alert("Call rejected");
      });

      // ========================
      // WEBRTC SIGNALING
      // ========================
      socket.on("offer", async ({ userId: remoteUserId, offer }) => {
        await initLocalStream();
        if (!peerConnections[remoteUserId]) {
          peerConnections[remoteUserId] =
            await createPeerConnection(remoteUserId);
        }
        const pc = peerConnections[remoteUserId];
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(offer));

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          socket.emit("answer", {
            roomId,
            answer,
            targetUserId: remoteUserId,
          });
        } catch (error) {
          console.error("Offer handling error:", error);
        }
      });

      socket.on("answer", async ({ userId: remoteUserId, answer }) => {
        const pc = peerConnections[remoteUserId];
        if (!pc) return;
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      });

      socket.on(
        "ice-candidate",
        async ({ userId: remoteUserId, candidate }) => {
          try {
            const pc = peerConnections[remoteUserId];
            if (!pc) return;
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
          } catch (err) {
            console.error("ICE error:", err);
          }
        },
      );

      // ========================
      // END CALL
      // ========================
      function endCall() {
        socket.emit("callEnded", {
          roomId,
          callId,
        });

        cleanupCall();
      }
      socket.on("participantLeft", ({ userId: remoteUserId }) => {
        const pc = peerConnections[remoteUserId];

        if (pc) {
          pc.close();
          delete peerConnections[remoteUserId];
        }

        const remoteVideo = document.getElementById(
          "remoteVideo_" + remoteUserId,
        );

        if (remoteVideo) {
          remoteVideo.remove();
        }
      });
      socket.on("callEnded", (data) => {
        cleanupCall();
        if (userId != data.userId) {
          alert("Call ended");
        }
      });

      function cleanupCall() {
        Object.values(peerConnections).forEach((pc) => pc.close());
        peerConnections = {};
        // Stop local stream tracks
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
        // Stop screen sharing tracks
        if (screenStream) {
          screenStream.getTracks().forEach((track) => track.stop());
          screenStream = null;
        }
        document.getElementById("localVideo").srcObject = null;
        document.getElementById("remoteVideos").innerHTML = "";

        callId = null;
        acceptBtn.style.display = "none";
        rejectBtn.style.display = "none";
        endBtn.style.display = "none";
        screenBtn.style.display = "none";
      }
    </script>
  </body>
</html>
